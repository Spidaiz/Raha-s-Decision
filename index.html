<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3033">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ASK THE GREAT SEPIDEH</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    box-sizing: border-box;
    background: #fafafa;
  }
  #meme {
    max-width: 100%;
    max-height: 48vh;
    border-radius: 12px;
    display: none;
  }
  #btn {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 70vh;
    border: none;
    border-radius: 16px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    background: #2b3033 url("sepideh.jpg") center top / cover no-repeat;
    -webkit-tap-highlight-color: transparent;
  }
  body.shown #btn { height: 34vh; }
  #btn span {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 12px 16px;
    color: #fff;
    font: bold 1.5rem Georgia, serif;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
  }
  #btn:active { transform: scale(0.98); }
</style>
</head>
<body>
  <img id="meme" alt="meme">
  <button id="btn"><span>ASK THE GREAT SEPIDEH</span></button>

<script>
  const TOTAL = 18;          // number of meme images (1.jpg ... 18.jpg)
  const EXT = "jpg";
  let last = 0;

  new Image().src = "sepideh.jpg";
  for (let i = 1; i <= TOTAL; i++) {
    new Image().src = i + "." + EXT;
  }

  document.getElementById("btn").addEventListener("click", () => {
    let n;
    do {
      n = Math.floor(Math.random() * TOTAL) + 1;
    } while (n === last);
    last = n;

    const img = document.getElementById("meme");
    img.src = n + "." + EXT;
    img.style.display = "block";
    document.body.classList.add("shown");
  });
</script>
</body>
</html>
